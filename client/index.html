    <!-- JSON-LD Structured Data: FAQPage (AEO - Answer Engine Optimization) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is BasisHK?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "BasisHK (also known as Basis HK or Basis Hong Kong) is Hong Kong's leading PropTech company that combines an AI-powered real estate CRM platform with a full-service marketing agency. Founded in 2024, BasisHK helps agents close more deals through AI lead qualification, real WhatsApp integration, personalized messaging, property video production, and targeted ad campaigns. The company is headquartered in Hong Kong."
          }
        },
        {
          "@type": "Question",
          "name": "What services does Basis HK offer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Basis HK offers two core products: (1) An AI-powered CRM Platform featuring AI lead qualification with BANT scoring, real WhatsApp integration, AI personalized messaging, email campaigns with reply tracking, AI-enhanced property listings with virtual staging, a property video enhancer, a full video editor with Cantonese AI voiceover, and bilingual support. (2) A Full-Service Marketing Agency providing AI video production, targeted ad campaigns, social media content, drone video editing, and virtual staging services. Plans start from HK$8,000/month."
          }
        },
        {
          "@type": "Question",
          "name": "How much does BasisHK cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "BasisHK offers three main plans: The Starter Plan at HK$8,000/month includes the CRM platform with AI lead qualification, WhatsApp integration, and 10 AI property videos. The Growth Plan at HK$15,000/month adds advanced features, 25 videos, and a branded property portal. The Agency Plan at HK$25,000/month includes everything plus dedicated account management, unlimited videos, and priority support. Add-on services like virtual staging, drone video editing, and social media content packs are also available."
          }
        },
        {
          "@type": "Question",
          "name": "Where is Basis HK located?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Basis HK (BasisHK) is headquartered in Hong Kong. The company primarily serves real estate agents and agencies in Hong Kong, with plans to expand across Asia. You can contact BasisHK at business@basis.hk or book a consultation at https://calendly.com/business-basis/30min."
          }
        },
        {
          "@type": "Question",
          "name": "Who founded BasisHK?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "BasisHK was founded in 2024 by a team of four co-founders: Michael Pang (CEO & Founder), Fabio Guaglione (COO & Co-Founder), Danish Agnihotri (CCO & Co-Founder), and Carol Chan (CBDO & Co-Founder). The team combines expertise in technology, real estate, and business development."
          }
        },
        {
          "@type": "Question",
          "name": "How does BasisHK's AI video generation work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "BasisHK uses advanced generative AI technology to create professional property videos from static photos. Agents simply upload property photos and floor plans, and BasisHK's AI generates cinematic video tours with smooth camera movements, professional voiceovers, background music, and lifestyle imagery. Videos are typically delivered within 48 hours."
          }
        },
        {
          "@type": "Question",
          "name": "Is BasisHK suitable for individual agents or agencies?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "BasisHK serves both individual real estate agents and large agencies. The Starter Plan (HK$8,000/month) is ideal for individual agents who want the CRM platform. The Growth Plan (HK$15,000/month) suits agents who need more videos and a branded portal. The Agency Plan (HK$25,000/month) is for top producers who want the full CRM plus dedicated marketing agency support."
          }
        },
        {
          "@type": "Question",
          "name": "What makes Basis HK different from other real estate marketing companies?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Basis HK differentiates itself through: 1) Dual Offering - the only company combining a real estate CRM platform with a marketing agency, 2) AI-First CRM - AI lead qualification with BANT scoring, real WhatsApp integration, and AI personalized messaging, 3) Hong Kong Focus - built for the local market with bilingual support and Cantonese AI voiceover, 4) Full-Service Agency - property video production, targeted ad campaigns, and social media content."
          }
        }
      ]
    }
    </script>
